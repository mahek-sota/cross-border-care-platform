name: cbcare

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cbcare}
      POSTGRES_DB: ${POSTGRES_DB:-cbcare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbcare} -d ${POSTGRES_DB:-cbcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket the API expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-cbcare-documents} &&
      echo 'bucket ready'
      "

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cbcare}:${POSTGRES_PASSWORD:-cbcare}@postgres:5432/${POSTGRES_DB:-cbcare}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cbcare}:${POSTGRES_PASSWORD:-cbcare}@postgres:5432/${POSTGRES_DB:-cbcare}_test
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-key-replace-before-deploying}
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cbcare}:${POSTGRES_PASSWORD:-cbcare}@postgres:5432/${POSTGRES_DB:-cbcare}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-key-replace-before-deploying}
    env_file:
      - .env
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
